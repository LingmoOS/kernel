name: Upload linux-7.3.4 source to OBS

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

concurrency:
  group: linux-7.3.4-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Build Debian source package
    runs-on: ubuntu-latest
    container: docker.io/library/debian:testing
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential devscripts dpkg-dev \
            debhelper quilt rsync python3 xz-utils fakeroot

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Debian source tree
        run: |
          set -eu
          test -d debian/debian
          mv debian/debian /tmp/debian-metadata
          rm -rf debian
          mv /tmp/debian-metadata debian
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -f debian/source/format

      - name: Apply Debian patches and generate control files
        run: |
          set -eu
          mkdir -p ../orig
          tar --exclude=./debian --exclude=./.git \
            --sort=name --mtime='UTC 2026-11-17' --owner=0 --group=0 --numeric-owner \
            -cJf ../linux_7.3.4.orig.tar.xz .
          mkdir -p ../orig/linux-7.3.4
          tar -xJf ../linux_7.3.4.orig.tar.xz -C ../orig/linux-7.3.4 --strip-components=0
          make -f debian/rules orig

      - name: Build source package
        run: dpkg-buildpackage -S -us -uc -d

      - name: Collect source package
        run: |
          set -eu
          mkdir -p src-tar-output
          cp ../linux_*.dsc ../linux_*.tar.* src-tar-output/
          test "$(find src-tar-output -maxdepth 1 -name '*.dsc' | wc -l)" -eq 1

      - name: Save source package
        uses: actions/upload-artifact@v4
        with:
          name: linux-7.3.4-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: src-tar-output/
          if-no-files-found: error
          compression-level: 0

      - name: Upload to OBS
        if: github.event_name == 'push'
        uses: LingmoOS/action-upload-to-obs@0.0.4
        with:
          remove-old-sources: true
          obs-package-name: linux-7.3.4
          obs-project-name: home:LingmoOS
          obs-user-name: ${{ secrets.OBS_USERNAME }}
          obs-password: ${{ secrets.OBS_TOKEN }}
          obs-instance-url: https://api.opensuse.org
          local-package-dir: ./src-tar-output
